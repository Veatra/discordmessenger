name: Build (MinGW)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  OPENSSL_DIR: '/tmp/dm-openssl'
  LIBWEBP_DIR: '/tmp/dm-libwebp/build'

jobs:
  build-linux-mingw:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Install Compiler Tools
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686-posix binutils-mingw-w64-i686 cmake
      
      - name: Test Application Logic
        run: |
          g++ -std=c++11 -Wall -Wextra -Isrc/core tests/typing_expiry.cpp -o /tmp/dm-typing-expiry
          /tmp/dm-typing-expiry
          python3 tests/status_bar_timers.py
          python3 tests/diagnostics_log.py
          python3 tests/windows_package.py
          python3 tests/bitmap_readback.py

      - name: Download OpenSSL
        run: |
          curl -fL --retry 2 -o "openssl-stuff.zip" https://github.com/DiscordMessenger/openssl/releases/download/release-2/openssl-stuff.zip
          mkdir -p $OPENSSL_DIR
          unzip openssl-stuff.zip -d $OPENSSL_DIR
      
      - name: Get Latest Tag
        id: get-latest-tag
        run: |
            echo "TAG=$(git describe --abbrev=0 --tags)" >> "$GITHUB_OUTPUT"
            echo "COMMIT=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      
      - name: Compile Libwebp
        run: |
            git clone https://github.com/DiscordMessenger/libwebp.git /tmp/dm-libwebp
            cd /tmp/dm-libwebp
            mkdir build && cd build
            cmake .. -DCMAKE_TOOLCHAIN_FILE=../win32.cmake
            make -j4
      
      - name: Make Unicode Build
        run: make -j4 all DEBUG=no DMCXX=i686-w64-mingw32-g++-posix COMMIT_HASH=${{ steps.get-latest-tag.outputs.COMMIT }}
      
      - name: Prepare Unicode Build
        run: |
          rm -rf bin/prepared && mkdir bin/prepared
          cp bin/DiscordMessenger.exe bin/prepared/DiscordMessenger.exe
          cp $OPENSSL_DIR/libcrypto-4.dll bin/prepared/libcrypto-4.dll
          cp $OPENSSL_DIR/libssl-4.dll bin/prepared/libssl-4.dll
          cp "$(i686-w64-mingw32-g++-posix -print-file-name=libwinpthread-1.dll)" bin/prepared/
          cp tools/Start-Diagnostics.ps1 bin/prepared/
          python3 tools/check_windows_package.py bin/prepared
          (cd bin/prepared && sha256sum DiscordMessenger.exe *.dll Start-Diagnostics.ps1 > SHA256SUMS.txt)
      
      - name: Upload Unicode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'DiscordMessenger-${{ steps.get-latest-tag.outputs.TAG }}-PRE-MinGW'
          path: bin/prepared/
